<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, userImageUrl, content)">
  <head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
  <body>
    <div class="relative flex min-h-screen flex-col bg-[#141414] dark group/design-root overflow-x-hidden"
         style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'>
      <div class="layout-container flex h-full grow flex-col">
        <header th:replace="~{fragments/header :: header(${userImageUrl})}"></header>
        <main class="px-40 flex flex-1 justify-center py-5">
          <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
            <div th:insert="${content}"></div>
          </div>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
      </div>
    </div>
  </body>
</html>
