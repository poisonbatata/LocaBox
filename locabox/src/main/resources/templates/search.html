<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <!-- Usa seu layout base já existente: layout(pageTitle, userImageUrl, content) -->
  <th:block th:replace="~{layout :: layout(${pageTitle} ?: 'LocaBox — Buscar', ${userImageUrl}, ~{::content})}">

    <!-- ====== CONTEÚDO DA PÁGINA (vai dentro do <main> do layout) ====== -->
    <th:block th:fragment="content">

      <!-- Barra de busca “ampla” da página (a do header continua existindo) -->
      <div class="px-4 py-3">
        <form th:action="@{/tool/search}" method="get">
          <label class="flex flex-col min-w-40 h-12 w-full">
            <div class="flex w-full flex-1 items-stretch rounded-xl h-full">
              <div class="text-[#ababab] flex border-none bg-[#303030] items-center justify-center pl-4 rounded-l-xl border-r-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                  <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
                </svg>
              </div>
              <input
                name="q"
                th:value="${q}"
                placeholder="Search for tools and equipment"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-0 border-none bg-[#303030] h-full placeholder:text-[#ababab] px-4 rounded-l-none border-l-0 pl-2 text-base font-normal leading-normal"
              />
            </div>
          </label>
        </form>
      </div>

      <!-- Chips de filtro (somente rótulo, como no HTML original) -->
      <div class="flex gap-3 p-3 flex-wrap pr-4">
        <button th:each="f : ${filters}"
                class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#303030] pl-4 pr-2">
          <p class="text-white text-sm font-medium leading-normal" th:text="${f}">Filter</p>
          <div class="text-white">
            <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
              <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path>
            </svg>
          </div>
        </button>
      </div>

      <!-- Grid de resultados -->
      <div class="grid grid-cols-[repeat(auto-fit,minmax(158px,1fr))] gap-3 p-4">
        <!-- Estado vazio -->
        <!--
        <div th:if="${successMessage}" class="alert alert-success text-[#ababab]" role="alert">
          <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger text-[#ababab]" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>
        -->
        <div th:if="${#lists.isEmpty(tools)}" class="col-span-full text-center py-10">
          <p class="text-[#ababab]">Nenhum item encontrado.</p>
        </div>

        <!-- Cards -->
        <div th:each="t : ${tools}" class="flex flex-col gap-3 pb-3">
          <a th:href="@{/tool/{id}(id=${t.id})}">
            <div class="w-full bg-center bg-no-repeat aspect-square bg-cover rounded-xl"
                 th:style="|background-image: url('${t.mainImageUrl}');|">
            </div>
          </a>
          <div>
            <p class="text-white text-base font-medium leading-normal" th:text="${t.title}">Tool name</p>
            <p class="text-[#ababab] text-sm font-normal leading-normal"
               th:text="|$${#numbers.formatDecimal(t.pricePerDay, 1, 'POINT', 2, 'COMMA')}/day · ${#numbers.formatDecimal(t.rating,1,'POINT',1,'NONE')} stars|">
              $00/day · 0.0 stars
            </p>
          </div>
        </div>
      </div>

      <!-- Paginação -->
      <div class="flex items-center justify-center p-4" th:if="${totalPages > 1}">
        <!-- Prev -->
        <a th:if="${page > 1}"
           th:href="@{/tool/search(page=${page-1}, q=${q})}"
           class="flex size-10 items-center justify-center">
          <div class="text-white">
            <svg xmlns="http://www.w3.org/2000/svg" width="18px" height="18px" fill="currentColor" viewBox="0 0 256 256">
              <path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path>
            </svg>
          </div>
        </a>

        <!-- Páginas -->
        <a th:each="p : ${#numbers.sequence(1, totalPages)}"
           th:href="@{/tool/search(page=${p}, q=${q})}"
           th:classappend="${p==page} ? ' bg-[#303030] font-bold' : ' font-normal'"
           class="text-sm leading-normal tracking-[0.015em] flex size-10 items-center justify-center text-white rounded-full">
          <span th:text="${p}">1</span>
        </a>

        <!-- Next -->
        <a th:if="${page < totalPages}"
           th:href="@{/tool/search(page=${page+1}, q=${q})}"
           class="flex size-10 items-center justify-center">
          <div class="text-white">
            <svg xmlns="http://www.w3.org/2000/svg" width="18px" height="18px" fill="currentColor" viewBox="0 0 256 256">
              <path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path>
            </svg>
          </div>
        </a>
      </div>

    </th:block>
    <!-- ====== /CONTEÚDO ====== -->

  </th:block>
</html>
