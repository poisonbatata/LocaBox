<!DOCTYPE html>
<html>
<head>
    <title th:text="${tool.nome}">Detalhe da Ferramenta</title>
</head>
<body>
    <h1 th:text="${tool.nome}">Nome</h1>
    <img th:src="${tool.fotos}" alt="Imagem da ferramenta" width="200"/>
    <p><b>Descrição:</b> <span th:text="${tool.descricao}"></span></p>
    <p><b>Categoria:</b> <span th:text="${tool.categoria}"></span></p>
    <p><b>Preço:</b> R$ <span th:text="${tool.preco}"></span></p>
    <p><b>Condição:</b> <span th:text="${tool.condicao}"></span></p>
    <p><b>Disponibilidade:</b> <span th:text="${tool.disponibilidade}"></span></p>
    <a href="/tool/list">Voltar para lista</a>
</body>
</html>
