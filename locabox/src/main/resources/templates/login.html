<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <!-- Usa seu layout base existente -->
  <th:block th:replace="~{layout :: layout(${pageTitle} ?: 'LocaBox — Entrar', ${userImageUrl}, ~{::content})}">

    <!-- ====== CONTEÚDO ====== -->
    <th:block th:fragment="content">
      <div class="px-40 flex flex-1 justify-center py-5">
        <div class="layout-content-container flex flex-col w-[512px] max-w-[512px] py-5 flex-1">
          <h2 class="text-white tracking-light text-[28px] font-bold leading-tight px-4 text-center pb-3 pt-5">
            Welcome back
          </h2>

          <!-- Mensagens (Spring Security) -->
          <div class="px-4" th:if="${param.error}">
            <p class="text-red-400 text-sm">Usuário ou senha inválidos.</p>
          </div>
          <div class="px-4" th:if="${param.logout}">
            <p class="text-green-400 text-sm">Você saiu da sua conta.</p>
          </div>

          <!-- Form de login -->
          <form th:action="@{/user/login}" method="post" class="contents">
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Email</p>
                <input
                  type="email"
                  name="username"  
                  autocomplete="username"
                  placeholder="Email"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white
                         focus:outline-0 focus:ring-0 border border-[#474747] bg-[#212121] h-14
                         placeholder:text-[#ababab] p-[15px] text-base font-normal leading-normal"
                  th:value="${param.username}" />
              </label>
            </div>

            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Password</p>
                <input
                  type="password"
                  name="password"
                  autocomplete="current-password"
                  placeholder="Password"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white
                         focus:outline-0 focus:ring-0 border border-[#474747] bg-[#212121] h-14
                         placeholder:text-[#ababab] p-[15px] text-base font-normal leading-normal" />
              </label>
            </div>

            <div class="flex items-center justify-between px-4 pt-1">
              <a th:href="@{/forgot-password}" class="text-[#ababab] text-sm underline">Forgot password?</a>
              <label class="inline-flex items-center gap-2 text-[#ababab] text-sm">
                <input type="checkbox" name="remember-me" class="rounded border-[#474747] bg-[#212121]"/>
                Remember me
              </label>
            </div>

            <div class="flex px-4 py-3">
              <button type="submit"
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden
                       rounded-full h-12 px-5 flex-1 bg-black text-white text-base font-bold leading-normal tracking-[0.015em]">
                <span class="truncate">Log in</span>
              </button>
            </div>
          </form>

          <p class="text-[#ababab] text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center">
            Don't have an account?
            <a th:href="@{/user/signup}" class="underline">Sign up</a>
          </p>
        </div>
      </div>
    </th:block>
    <!-- ====== /CONTEÚDO ====== -->

  </th:block>
</html>
